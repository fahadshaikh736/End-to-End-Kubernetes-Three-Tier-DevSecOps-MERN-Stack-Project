apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: three-tier
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 797260140066.dkr.ecr.ap-south-1.amazonaws.com/three-tier-frontend:5
          ports:
            - containerPort: 3000
          env:
            - name: REACT_APP_BACKEND_URL
              value: /api/tasks
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: three-tier
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000